# ==============================================================================
# ParsLinux PipeWire Ses Sunucusu Yapılandırması (99-pars-audio.conf)
# ==============================================================================
# Düşük gecikme (low-latency) ve kristal netliğinde ses performansı için
# optimize edilmiş ParsLinux sistem varsayılanları.
# ==============================================================================

context.properties = {
    # Varsayılan örnekleme hızı (modern ses standartı)
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 192000 ]
    
    # Kuantum (buffer) boyutları: Oyun ve medya için pürüzsüz akış
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 2048
}
